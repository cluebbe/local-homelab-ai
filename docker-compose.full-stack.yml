# Full homelab stack: Ollama AND Open WebUI, both in Docker.
#
# Use this instead of docker-compose.yml on a dedicated server where Ollama is
# NOT installed natively (a native Ollama already occupies port 11434).
#
# Start:   docker compose -f docker-compose.full-stack.yml up -d
# Models:  docker exec -it ollama ollama pull llama3.2:3b
# Stop:    docker compose -f docker-compose.full-stack.yml down   (volumes are kept)
#
# Then open http://localhost:3000 and create the first (admin) account.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"      # Bind to localhost only — never expose this to the internet
    volumes:
      - ollama-models:/root/.ollama  # Downloaded models survive container updates
    # NVIDIA GPU on Linux: install the NVIDIA Container Toolkit, then uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434   # Containers find each other by service name
    volumes:
      - open-webui-data:/app/backend/data     # Users, chats and uploaded documents

volumes:
  ollama-models:
  open-webui-data:
