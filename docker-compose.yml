# Open WebUI in Docker, talking to the Ollama you installed natively.
#
# Start:   docker compose up -d
# Status:  docker compose ps
# Logs:    docker compose logs -f
# Stop:    docker compose down          (the volume — your data — is kept)
#
# Then open http://localhost:3000 and create the first (admin) account.
#
# Linux only: Ollama must listen on the Docker bridge as well. Run
#   sudo systemctl edit ollama   and add:   Environment="OLLAMA_HOST=0.0.0.0"
# then restart Ollama, and block port 11434 from outside in your firewall.

name: homelab-ai                                        # Fixed project name, so the volume is always called homelab-ai_open-webui-data

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"                            # Reachable from this computer only
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434  # "the computer running Docker"
    extra_hosts:
      - "host.docker.internal:host-gateway"              # Makes that name work on Linux too
    volumes:
      - open-webui-data:/app/backend/data                # Accounts, chats, uploaded documents

volumes:
  open-webui-data:
